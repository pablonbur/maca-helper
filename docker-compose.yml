services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "1420:1420"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm test
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  build:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run build
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
