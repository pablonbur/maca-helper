[package]
name = "maca-helper"
version = "0.1.2"
description = "Maca Helper"
authors = ["Maca Helper"]
edition = "2021"

[lib]
name = "maca_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
